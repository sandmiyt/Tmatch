name: iOS Build & Unsigned IPA

on:
  push:
    paths:
      - 'Tijing/**'
      - 'Tijing.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'Tijing/**'
      - 'Tijing.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release for iPhone device SDK
        run: |
          set -o pipefail
          rm -rf DerivedData ipa Tijing-unsigned.ipa

          xcodebuild \
            -project Tijing.xcodeproj \
            -scheme Tijing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild-device.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          ROOT_DIR="$PWD"
          APP_PATH="$ROOT_DIR/DerivedData/Build/Products/Release-iphoneos/Tijing.app"
          IPA_PATH="$ROOT_DIR/Tijing-unsigned.ipa"
          PACKAGE_DIR="$ROOT_DIR/ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "error: Built app not found at $APP_PATH"
            find "$ROOT_DIR/DerivedData/Build/Products" -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf "$PACKAGE_DIR" "$IPA_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Tijing.app"

          # Keep the package explicitly unsigned so the user can sign it later.
          rm -rf "$PACKAGE_DIR/Payload/Tijing.app/_CodeSignature"
          rm -f "$PACKAGE_DIR/Payload/Tijing.app/embedded.mobileprovision"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          if [ ! -f "$IPA_PATH" ]; then
            echo "error: IPA packaging finished but output was not created at $IPA_PATH"
            find "$ROOT_DIR" -maxdepth 3 -name '*.ipa' -print || true
            exit 1
          fi

          echo "Generated IPA:"
          ls -lh "$IPA_PATH"
          shasum -a 256 "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tijing-unsigned-ipa
          path: Tijing-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build Debug for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Tijing.xcodeproj \
            -scheme Tijing \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-simulator.log

      - name: Surface real compiler errors first
        if: failure()
        run: |
          echo '===== iPhone device compiler error: lines ====='
          if [ -f xcodebuild-device.log ]; then
            grep -nE '(^|[[:space:]])error:' xcodebuild-device.log | head -120 || true
            echo '===== iPhone device log tail ====='
            tail -120 xcodebuild-device.log || true
          fi

          echo '===== Simulator compiler error: lines ====='
          if [ -f xcodebuild-simulator.log ]; then
            grep -nE '(^|[[:space:]])error:' xcodebuild-simulator.log | head -120 || true
            echo '===== Simulator log tail ====='
            tail -120 xcodebuild-simulator.log || true
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-device.log
            xcodebuild-simulator.log
          if-no-files-found: ignore
          retention-days: 7
