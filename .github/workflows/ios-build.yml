name: iOS Xcode Build

on:
  push:
    paths:
      - 'Tijing/**'
      - 'Tijing.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'Tijing/**'
      - 'Tijing.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iPhone app for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Tijing.xcodeproj \
            -scheme Tijing \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
      - name: Surface real compiler errors first
        if: failure()
        run: |
          echo '===== compiler error: lines ====='
          grep -nE '(^|[[:space:]])error:' xcodebuild.log | head -120 || true
          echo '===== tail ====='
          tail -120 xcodebuild.log || true
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
